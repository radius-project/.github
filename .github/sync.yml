# yaml-language-server: $schema=https://raw.githubusercontent.com/raven-actions/repo-files-sync/main/sync.schema.json
# docs: https://github.com/raven-actions/repo-files-sync?tab=readme-ov-file#advanced-sync-config
# nunjucks template: https://mozilla.github.io/nunjucks/templating.html
---
group:
  # source: https://github.com/orgs/radius-project/repositories?q=archived%3Afalse+sort%3Aname-asc
  - repos: |
      radius-project/.github
      radius-project/bicep-types-aws
      radius-project/blog
      radius-project/community
      radius-project/dashboard
      radius-project/docs@edge
      radius-project/lab
      radius-project/radius
      radius-project/recipes
      radius-project/resource-types-contrib
      radius-project/roadmap
      radius-project/samples@edge
      radius-project/terraform-private-modules
      radius-project/website
    files:
      - source: sync-templates/LICENSE.APACHE20
        dest: LICENSE

      - source: sync-templates/.gitattributes
        dest: .gitattributes

      - source: sync-templates/.editorconfig
        dest: .editorconfig

      - source: sync-templates/.github/CODEOWNERS.njk
        dest: .github/CODEOWNERS
        template:
          maintainers_prefix: "@radius-project/maintainers-"
          approvers_prefix: "@radius-project/approvers-"
          oncall: "@radius-project/on-call"

      - source: workflow-templates/dependency-review.yml
        dest: .github/workflows/dependency-review.yml

      - source: workflow-templates/dependabot-manager.yml
        dest: .github/workflows/dependabot-manager.yml

  - repos: |
      radius-project/radius
    files:
      - source: sync-templates/.github/instructions/shell.instructions.md
        dest: .github/instructions/shell.instructions.md

  # Spellcheck (cspell) config and workflow for the documentation-heavy repos.
  # Destination workflow keeps the existing `.yaml` extension so it overwrites
  # the per-repo workflow instead of creating a duplicate.
  - repos: |
      radius-project/blog
      radius-project/docs@edge
      radius-project/radius
      radius-project/website
    files:
      - source: sync-templates/.github/configs/.cspell.yml
        dest: .github/configs/.cspell.yml

      - source: workflow-templates/spellcheck.yml
        dest: .github/workflows/spellcheck.yaml

  # ----------------------------------------------------------------------------
  # Dependabot - generated per-repo from one universal template. Declare only the
  # package ecosystems each repo uses; the repository root "/" is the template
  # default, so it is omitted here (only non-root paths are listed).
  # Template: sync-templates/.github/dependabot.yml.njk
  # ----------------------------------------------------------------------------

  # github-actions only
  - repos: |
      radius-project/community
      radius-project/recipes
      radius-project/website
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions

  - repos: |
      radius-project/wellknown
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
            - type: devcontainers

  - repos: |
      radius-project/dashboard
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
            - type: npm
            - type: devcontainers

  - repos: |
      radius-project/resource-types-contrib
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
            - type: gomod
            - type: devcontainers

  - repos: |
      radius-project/blog
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
            - type: gomod
              directory: /radblog
            - type: npm
              directory: /radblog

  - repos: |
      radius-project/bicep-types-aws
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
            - type: gitsubmodule
            - type: devcontainers
            - type: gomod
              directory: /src/aws-type-downloader
            - type: npm
              directory: /src/aws-type-generator

  - repos: |
      radius-project/radius
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
              directories:
                - "/"
                - "/.github/actions/*"
            - type: gomod
              directories:
                - "/"
                - "/test/magpiego"
                - "/test/testrp"
            - type: npm
              directories:
                - "/"
                - "/typespec"
                - "/hack/bicep-types-radius/src/autorest.bicep"
                - "/hack/bicep-types-radius/src/generator"
            - type: devcontainers

  - repos: |
      radius-project/docs@edge
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
              ignore:
                - dependency-name: "Azure/static-web-apps-deploy"
            - type: devcontainers
            - type: gomod
              directory: /docs
            - type: npm
              directory: /docs

  - repos: |
      radius-project/samples@edge
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
            - type: gomod
              directory: /samples/aws-sqs
            - type: devcontainers
            - type: gitsubmodule
            - type: npm
              directories:
                - "/playwright"
                - "/samples/dapr/nodeapp"
                - "/samples/demo"
                - "/samples/demo/client"
              ignore:
                - dependency-name: "*"
                  update-types:
                    - "version-update:semver-minor"
                    - "version-update:semver-major"
            - type: nuget
              directories:
                - "/samples/aws"
                - "/samples/dapr/ui"
            - type: pip
              directory: /samples/volumes/src
