# yaml-language-server: $schema=https://raw.githubusercontent.com/raven-actions/repo-files-sync/main/sync.schema.json
# docs: https://github.com/raven-actions/repo-files-sync?tab=readme-ov-file#advanced-sync-config
# nunjucks template: https://mozilla.github.io/nunjucks/templating.html
---
group:
  # source: https://github.com/orgs/radius-project/repositories?q=archived%3Afalse+sort%3Aname-asc
  - repos: |
      radius-project/.github
      radius-project/ai-extensions
      radius-project/bicep-types-aws
      radius-project/blog
      radius-project/community
      radius-project/dashboard
      radius-project/docs@edge
      radius-project/lab
      radius-project/radius
      radius-project/recipes
      radius-project/resource-types-contrib
      radius-project/roadmap
      radius-project/samples@edge
      radius-project/terraform-private-modules
      radius-project/website
    files:
      - source: sync-templates/LICENSE.APACHE20
        dest: LICENSE

      - source: sync-templates/.gitattributes
        dest: .gitattributes

      - source: sync-templates/.editorconfig
        dest: .editorconfig

      - source: sync-templates/.github/linters/.markdownlint.yml
        dest: .github/linters/.markdownlint.yml

      - source: sync-templates/.github/linters/.markdownlint-cli2.yaml
        dest: .github/linters/.markdownlint-cli2.yaml

      - source: sync-templates/.github/linters/.prettierrc.yml
        dest: .github/linters/.prettierrc.yml

      - source: sync-templates/.github/linters/.shellcheckrc
        dest: .github/linters/.shellcheckrc

      - source: sync-templates/.github/linters/.yamllint.yml
        dest: .github/linters/.yamllint.yml

      - source: sync-templates/.github/CODEOWNERS.njk
        dest: .github/CODEOWNERS
        template:
          maintainers_prefix: "@radius-project/maintainers-"
          approvers_prefix: "@radius-project/approvers-"
          oncall: "@radius-project/on-call"
          # Repos that share an owning team instead of using their own repo
          # name. blog and website are owned by the docs team, so they resolve
          # to @radius-project/maintainers-docs and @radius-project/approvers-docs
          # (docs itself already maps to the docs team via its repo name).
          team_overrides:
            blog: docs
            website: docs

      - source: workflow-templates/dependency-review.yml
        dest: .github/workflows/dependency-review.yml

      - source: workflow-templates/dependabot-manager.yml
        dest: .github/workflows/dependabot-manager.yml

      - source: workflow-templates/dependabot-failures.yml
        dest: .github/workflows/dependabot-failures.yml

      - source: workflow-templates/issue-metrics.yml
        dest: .github/workflows/issue-metrics.yml

      - source: workflow-templates/pr-author.yml
        dest: .github/workflows/pr-author.yml

  # Pull request template - synced to all non-archived public repos plus the
  # ai-extensions repo.
  # source: https://github.com/orgs/radius-project/repositories?q=archived%3Afalse+visibility%3Apublic+sort%3Aname-asc
  - repos: |
      radius-project/.github
      radius-project/ai-extensions
      radius-project/bicep-types-aws
      radius-project/blog
      radius-project/community
      radius-project/dashboard
      radius-project/docs@edge
      radius-project/lab
      radius-project/radius
      radius-project/recipes
      radius-project/resource-types-contrib
      radius-project/roadmap
      radius-project/samples@edge
      radius-project/skills
      radius-project/website
    files:
      - source: sync-templates/.github/pull_request_template.md
        dest: .github/pull_request_template.md

  - repos: |
      radius-project/radius
    files:
      - source: sync-templates/.github/instructions/shell.instructions.md
        dest: .github/instructions/shell.instructions.md

  - repos: |
      radius-project/radius
      radius-project/ai-extensions
    files:
      - source: sync-templates/.github/instructions/markdown.instructions.md
        dest: .github/instructions/markdown.instructions.md

  # Signed release upmerge - native callers only; shared implementation stays
  # here. Keep the destination filename used by the release coordinator.
  - repos: |
      radius-project/docs@edge
    files:
      - source: workflow-templates/upmerge-docs.yml
        dest: .github/workflows/upmerge.yaml

  - repos: |
      radius-project/samples@edge
    files:
      - source: workflow-templates/upmerge-samples.yml
        dest: .github/workflows/upmerge.yaml

  # PR status labels - lifecycle labels, the read-only review signal relay, and
  # the centrally managed .github/labels.yml with the workflow that applies it.
  # Enrolled: .github, ai-extensions, dashboard, docs (edge), lab, radius,
  # recipes, resource-types-contrib and website. Add repositories here only
  # after their own lifecycle-label workflows have been removed.
  # docs syncs to edge, which is not its default branch. PRs into edge are
  # labeled right away, but the schedule, review signals and label sync run
  # only from the default branch, so they start once the next release branch
  # is cut from edge. docs' required "Check for do-not-merge tag" check is
  # moving to the shared hold check (__pr-holds.yml) in docs.
  # Docs: .github/actions/pr-status-labels/README.md
  - repos: |
      radius-project/.github
      radius-project/ai-extensions
      radius-project/dashboard
      radius-project/docs@edge
      radius-project/lab
      radius-project/radius
      radius-project/recipes
      radius-project/resource-types-contrib
      radius-project/website
    files:
      - source: workflow-templates/pr-status-labels.yml
        dest: .github/workflows/pr-status-labels.yml

      - source: workflow-templates/pr-review-signal.yml
        dest: .github/workflows/pr-review-signal.yml

      - source: workflow-templates/labels.yml
        dest: .github/workflows/labels.yml

      # Shared labels live in the template. To add repository-specific labels,
      # list them under repo_labels, keyed by repository name (without the
      # owner); see the template header for the label options. List an
      # enrolling repository's existing pr: labels exactly as they are, so the
      # sync does not change them.
      - source: sync-templates/.github/labels.yml.njk
        dest: .github/labels.yml
        template:
          repo_labels:
            ai-extensions:
              - name: pr:standard
                color: 0366d6
                description: Standard pull request
              - name: pr:important
                color: 4a08c1
              - name: pr:no-changeset
                color: 0052cc
              - name: pr:update-visual-baselines
                color: 1D76DB
                description: Regenerate and commit Canvas visual baselines for this pull request
            dashboard:
              - name: pr:standard
                color: EDEDED
                description: Standard pull request
            radius:
              - name: pr:standard
                color: 86a16a
                description: Ongoing maintenance, minor improvements, documentation updates, and routine development work
              - name: pr:important
                color: 86a16a
                description: High-impact changes needing special attention during release and in release notes
            resource-types-contrib:
              - name: pr:standard
                color: ededed
              - name: pr:important
                color: 86a16a
                description: High-impact changes needing special attention during release and in release notes

  # Spellcheck (cspell) config and workflow for the documentation-heavy repos.
  # Destination workflow keeps the existing `.yaml` extension so it overwrites
  # the per-repo workflow instead of creating a duplicate.
  - repos: |
      radius-project/blog
      radius-project/docs@edge
      radius-project/radius
      radius-project/resource-types-contrib
      radius-project/website
    files:
      - source: sync-templates/.github/linters/.cspell.yml
        dest: .github/linters/.cspell.yml

      - source: workflow-templates/spellcheck.yml
        dest: .github/workflows/spellcheck.yaml

  # ----------------------------------------------------------------------------
  # Dependabot - generated per-repo from one universal template. Declare only the
  # package ecosystems each repo uses. For single-path configs, omit `directory` to
  # default to "/"; when using `directories:` (multi-path), include "/" explicitly.
  # Template: sync-templates/.github/dependabot.yml.njk
  # ----------------------------------------------------------------------------

  - repos: |
      radius-project/.github
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
              directories: ["/", "/workflow-templates", "/.github/actions/*"]

  - repos: |
      radius-project/ai-extensions
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
            - type: npm

  # github-actions only
  - repos: |
      radius-project/community
      radius-project/recipes
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions

  - repos: |
      radius-project/website
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
            - type: gomod
            - type: npm

  - repos: |
      radius-project/wellknown
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
            - type: devcontainers
            - type: opentofu
              directories: ["/**/*"]

  - repos: |
      radius-project/dashboard
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
            - type: npm
            - type: devcontainers

  - repos: |
      radius-project/resource-types-contrib
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
            - type: gomod
            - type: devcontainers

  - repos: |
      radius-project/blog
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
            - type: gomod
              directory: /radblog
            - type: npm
              directory: /radblog

  - repos: |
      radius-project/bicep-types-aws
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
            - type: gitsubmodule
            - type: devcontainers
            - type: gomod
              directory: /src/aws-type-downloader
            - type: npm
              directory: /src/aws-type-generator

  - repos: |
      radius-project/radius
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
              directories:
                - "/"
                - "/.github/actions/*"
            - type: gomod
              directories:
                - "/"
                - "/test/magpiego"
                - "/test/testrp"
            - type: npm
              directories:
                - "/"
                - "/typespec"
                - "/hack/bicep-types-radius/src/typespec-bicep-types"
            - type: docker
              directories:
                - "/"
                - "/**/*"
            - type: devcontainers

  - repos: |
      radius-project/docs@edge
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
              ignore:
                - dependency-name: "Azure/static-web-apps-deploy"
            - type: devcontainers
            - type: gomod
              directory: /docs
            - type: npm
              directory: /docs

  - repos: |
      radius-project/samples@edge
    files:
      - source: sync-templates/.github/dependabot.yml.njk
        dest: .github/dependabot.yml
        template:
          ecosystems:
            - type: github-actions
            - type: gomod
              directory: /samples/aws-sqs
            - type: devcontainers
            - type: gitsubmodule
            - type: npm
              directories:
                - "/playwright"
                - "/samples/dapr/nodeapp"
                - "/samples/demo"
                - "/samples/demo/client"
              ignore:
                - dependency-name: "*"
                  update-types:
                    - "version-update:semver-minor"
                    - "version-update:semver-major"
            - type: nuget
              directories:
                - "/samples/aws"
                - "/samples/dapr/ui"
            - type: pip
              directory: /samples/volumes/src
