# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
# docs: ../../../eng/SYNC.md#release-backports
---
name: Release Backport
description: Select, collect, or prepare source-traceable release backports.
author: radius-project

inputs:
  operation:
    description: Select pending backports, collect live records, or prepare the selected backport.
    required: true
  github-token:
    description: Repository token for reading PRs and fetching the selected source.
    default: ${{ github.token }}
  channel:
    description: Release channel in X.Y format; selection otherwise follows the triggering event.
    default: ""
  explicit-prs:
    description: Optional comma-separated merged main PRs to include when collecting.
    default: ""
  output-file:
    description: Required JSON output path for the collect operation.
    default: ""
  source-pr:
    description: Merged source PR number.
    default: ""
  source-commit:
    description: Exact main merge commit.
    default: ""
  source-title:
    description: Source PR title.
    default: ""
  source-url:
    description: Source PR URL.
    default: ""
  expected-base:
    description: Optional approved release-branch base for Radius release metadata.
    default: ""

outputs:
  backports:
    description: JSON matrix of the next pending backport in each selected channel.
    value: ${{ steps.select.outputs.result }}
  status:
    description: success, conflict, already-present, existing, or deferred.
    value: ${{ steps.prepare.outputs.status }}
  url:
    description: Existing backport or source PR URL, when no new PR is needed.
    value: ${{ steps.prepare.outputs.url }}
  branch:
    description: Prepared backport branch.
    value: ${{ steps.prepare.outputs.branch }}
  title:
    description: Source PR title for the backport.
    value: ${{ steps.prepare.outputs.title }}
  author:
    description: Original source commit author; empty for a conflict handoff.
    value: ${{ steps.prepare.outputs.author }}
  commit-message:
    description: Commit message retaining source attribution and cherry-pick provenance.
    value: ${{ steps.prepare.outputs.commit-message }}

runs:
  using: composite
  steps:
    - name: Validate operation
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
      run: |
        case "${OPERATION}" in
          select | collect | prepare) ;;
          *) echo "::error::operation must be select, collect, or prepare"; exit 1 ;;
        esac

    - name: Collect backport records
      if: inputs.operation == 'collect'
      shell: bash
      env:
        BACKPORT_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        CHANNEL: ${{ inputs.channel }}
        EXPLICIT_PRS: ${{ inputs.explicit-prs }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        bash "${BACKPORT_ACTION_PATH}/collect-release-backports.sh" \
          --repository "${GITHUB_REPOSITORY}" --channel "${CHANNEL}" \
          --explicit-prs "${EXPLICIT_PRS}" --output "${OUTPUT_FILE}"

    - name: Select pending backports
      if: inputs.operation == 'select'
      id: select
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BACKPORT_ACTION_PATH: ${{ github.action_path }}
        CHANNEL: ${{ inputs.channel }}
      with:
        github-token: ${{ inputs.github-token }}
        result-encoding: string
        script: |
          const { selectReleaseBackports } = await import(
            `${process.env.BACKPORT_ACTION_PATH}/select-release-backports.mjs`
          )
          return JSON.stringify(await selectReleaseBackports({
            github, context, channel: process.env.CHANNEL
          }))

    - name: Prepare backport
      if: inputs.operation == 'prepare'
      id: prepare
      shell: bash
      env:
        BACKPORT_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE_PR: ${{ inputs.source-pr }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        SOURCE_TITLE: ${{ inputs.source-title }}
        SOURCE_URL: ${{ inputs.source-url }}
        CHANNEL: ${{ inputs.channel }}
        EXPECTED_BASE: ${{ inputs.expected-base }}
      run: bash "${BACKPORT_ACTION_PATH}/prepare-release-backport.sh"
