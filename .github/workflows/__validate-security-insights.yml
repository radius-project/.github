# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# docs:
# - https://github.com/ossf/security-insights
# - https://cuelang.org/docs/reference/command/cue-help-vet/
---
name: __validate-security-insights

on:
  workflow_call:

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CUE_VERSION: v0.15.4
      # SHA-256 of cue_${CUE_VERSION}_linux_amd64.tar.gz from the CUE release.
      CUE_SHA256: 4709f0d3e9988b82192a205953fefdbb3637317a1cef63d84fe65b7b92ef95a3
      SCHEMA_VERSION: v2.2.0
      SCHEMA_SHA256: 4e4b61470b5484fc8969f2a8a77ffbe0712a7c8a870c2079188f246c14cd58b1
      PARENT_URL: https://raw.githubusercontent.com/radius-project/.github/main/security-insights.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install CUE
        run: |
          archive="cue_${CUE_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/cue-lang/cue/releases/download/${CUE_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "${CUE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/cue"
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" \
            --directory "${RUNNER_TEMP}/cue" cue
          echo "${RUNNER_TEMP}/cue" >> "${GITHUB_PATH}"

      - name: Download schema
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/ossf/security-insights/${SCHEMA_VERSION}/spec/schema.cue" \
            --output "${RUNNER_TEMP}/schema.cue"
          echo "${SCHEMA_SHA256}  ${RUNNER_TEMP}/schema.cue" | sha256sum --check -

      - name: Validate Security Insights
        run: |
          cue vet -d '#SecurityInsights' \
            "${RUNNER_TEMP}/schema.cue" security-insights.yml

      - name: Validate parent
        shell: bash
        run: |
          declared_parent=$(
            cue export security-insights.yml --out json |
              jq --raw-output '.header["project-si-source"] // empty'
          )
          if [[ -z "${declared_parent}" ]]; then
            manifest_url=$(
              cue export security-insights.yml --out json | jq --raw-output '.header.url'
            )
            if [[ "${manifest_url}" != "${PARENT_URL}" ]]; then
              echo "Set header.project-si-source to ${PARENT_URL}" >&2
              exit 1
            fi
            echo "This is the parent manifest; skipping parent validation."
            exit 0
          fi
          if [[ "${declared_parent}" != "${PARENT_URL}" ]]; then
            echo "Unexpected project-si-source: ${declared_parent}" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location \
            "${PARENT_URL}" --output "${RUNNER_TEMP}/parent-security-insights.yml"
          cue vet -d '#SecurityInsights' \
            "${RUNNER_TEMP}/schema.cue" \
            "${RUNNER_TEMP}/parent-security-insights.yml"
