# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync.yml
      - .github/sync.yml
      - sync-templates/**
      - workflow-templates/*.yaml
      - workflow-templates/*.yml

permissions: {}

concurrency:
  group: ${{ format('{0}-{1}-{2}-{3}-{4}', github.workflow, github.event_name, github.ref, github.base_ref, github.head_ref) }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Get App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: get-token
        with:
          client-id: ${{ secrets.FILES_SYNC_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FILES_SYNC_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Get bot details
        id: bot-details
        uses: raven-actions/bot-details@ee8966a9ff6e7e42cbfc4a56b4ddb60a9d1b40a6 # v1.2.0
        with:
          bot-slug-name: ${{ steps.get-token.outputs.app-slug }}
          set-env: false

      - name: Run Repo Files Sync
        uses: raven-actions/repo-files-sync@582aa267ed2bf36a99838e508d4c4ab48083ee60 # v0.1.0-rc.15
        with:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}
          CONFIG_PATH: ./.github/sync.yml
          COMMIT_PREFIX: "chore(sync):"
          BRANCH_PREFIX: repo-sync
          GIT_EMAIL: ${{ steps.bot-details.outputs.email }}
          GIT_USERNAME: ${{ steps.bot-details.outputs.name }}
          REBASE: true
