# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync.yml
      - .github/sync.yml
      - sync-templates/**
      - workflow-templates/*.yaml
      - workflow-templates/*.yml
  workflow_dispatch:
    inputs:
      repo:
        description: "Limit the sync to a single target repo (owner/name, optional @branch). Leave empty to sync every repo in .github/sync.yml."
        required: false
        type: string
      dry-run:
        description: "Run the sync without pushing changes or opening PRs (preview only)."
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ format('{0}-{1}-{2}-{3}-{4}', github.workflow, github.event_name, github.ref, github.base_ref, github.head_ref) }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Get App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: get-token
        with:
          client-id: ${{ secrets.FILES_SYNC_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FILES_SYNC_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Get bot details
        id: bot-details
        uses: raven-actions/bot-details@ee8966a9ff6e7e42cbfc4a56b4ddb60a9d1b40a6 # v1.2.0
        with:
          bot-slug-name: ${{ steps.get-token.outputs.app-slug }}
          set-env: false

      - name: Resolve sync config
        id: config
        env:
          FILTER_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          if [ -z "${FILTER_REPO//[[:space:]]/}" ]; then
            echo "No repo filter provided - syncing all repos from .github/sync.yml"
            echo "path=./.github/sync.yml" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Match on owner/name only; keep the original line (with any @branch).
          REQ="${FILTER_REPO%@*}"
          export REQ
          echo "Filtering sync config to '$REQ' (from input '$FILTER_REPO')"
          yq eval '
            .group |= (
              map(
                .repos = (
                  (.repos // "")
                  | split("\n")
                  | map(sub("^\s+"; "") | sub("\s+$"; ""))
                  | map(select(length > 0))
                  | map(select(sub("@.*$"; "") == strenv(REQ)))
                  | join("\n")
                )
              )
              | map(select((.repos // "") | length > 0))
            )
          ' ./.github/sync.yml > ./.github/sync.filtered.yml
          if [ "$(yq eval '.group | length' ./.github/sync.filtered.yml)" = "0" ]; then
            echo "::error::Repo '$REQ' was not found in any group in .github/sync.yml"
            exit 1
          fi
          echo "----- filtered sync config -----"
          cat ./.github/sync.filtered.yml
          echo "path=./.github/sync.filtered.yml" >> "$GITHUB_OUTPUT"

      - name: Run Repo Files Sync
        uses: raven-actions/repo-files-sync@a4c9248f592fa5c5d19d70f630b7bd0d4772ab67 # v0.1.0-rc.12
        with:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}
          CONFIG_PATH: ${{ steps.config.outputs.path }}
          COMMIT_PREFIX: "chore(sync):"
          BRANCH_PREFIX: repo-sync
          GIT_EMAIL: ${{ steps.bot-details.outputs.email }}
          GIT_USERNAME: ${{ steps.bot-details.outputs.name }}
          REBASE: true
          DRY_RUN: ${{ inputs.dry-run || false }}
