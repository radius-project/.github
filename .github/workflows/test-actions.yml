# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Test Actions

on:
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/test-actions.yml
  push:
    branches:
      - main
    paths:
      - .github/actions/**
      - .github/workflows/test-actions.yml

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: node --test .github/actions/*/*.test.mjs
