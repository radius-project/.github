# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Test Actions

on:
  pull_request:
    paths:
      - .github/actions/**
      - .github/tests/**
      - .github/workflows/__upmerge.yml
      - .github/workflows/test-actions.yml
      - .github/sync.yml
      - sync-templates/.github/workflows/upmerge.yaml.njk
  push:
    branches:
      - main
    paths:
      - .github/actions/**
      - .github/tests/**
      - .github/workflows/__upmerge.yml
      - .github/workflows/test-actions.yml
      - .github/sync.yml
      - sync-templates/.github/workflows/upmerge.yaml.njk

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install template test dependencies
        run: npm install --prefix "${RUNNER_TEMP}/upmerge-test" --ignore-scripts --no-audit --no-fund --no-package-lock nunjucks@3.2.4 yaml@2.9.0

      - name: Run tests
        env:
          NODE_PATH: ${{ runner.temp }}/upmerge-test/node_modules
        run: node --test .github/actions/*/*.test.mjs .github/tests/*.test.*
