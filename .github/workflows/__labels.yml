# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# docs:
# - ../actions/pr-status-labels/README.md#label-catalog
# - https://github.com/crazy-max/ghaction-github-labeler
# Applies the repository's .github/labels.yml, which is synced from
# sync-templates/.github/labels.yml.njk in radius-project/.github. Labels that
# the file does not list are never deleted.
---
name: __labels

on:
  workflow_call:

permissions: {}

jobs:
  preview:
    if: github.event_name == 'pull_request'
    name: Preview label changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      # The proposed file is data only; the pinned labeler parses it with a
      # read-only token and applies it as a dry run.
      - name: Checkout proposed labels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/labels.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Preview label changes
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
          dry-run: true

  sync:
    if: >-
      github.event_name == 'label' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    name: Sync labels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted labels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/labels.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
