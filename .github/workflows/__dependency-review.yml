# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# docs:
# - https://github.com/actions/dependency-review-action
# - https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/manage-your-dependency-security/configuring-the-dependency-review-action
---
name: __dependency-review

on:
  workflow_call:

permissions: {}

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: always
          retry-on-snapshot-warnings: true
          warn-on-openssf-scorecard-level: 4
