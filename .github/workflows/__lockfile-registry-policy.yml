# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# docs: ../actions/lockfile-registry-policy/README.md
---
name: __lockfile-registry-policy

on:
  workflow_call:
    inputs:
      blocked-registries:
        description: Newline-separated hostname or HTTP(S) URL globs. The repository variable LOCKFILE_BLOCKED_REGISTRIES takes precedence.
        type: string
        required: false
        default: |
          *.pkgs.visualstudio.com
          pkgs.dev.azure.com

permissions: {}

jobs:
  check:
    name: Check registry URLs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use the action from the same commit as this reusable workflow, never
      # executable code from the repository being checked.
      - name: Check registry URLs
        uses: $/.github/actions/lockfile-registry-policy
        with:
          blocked-registries: ${{ vars.LOCKFILE_BLOCKED_REGISTRIES || inputs.blocked-registries }}
