# Shared PR lifecycle and manual hold labels for the PR Status Labels automation.
# The names match the defaults in .github/actions/pr-status-labels/labels.json.
# Synced by .github/workflows/__labels.yml; a repository's own .github/labels.yml
# wins for any label it defines (by name or from_name).
---
# Lifecycle and hold labels share blue.
- name: pr:needs-reviewer
  color: 1D76DB
  description: No pending review request or active submitted human review
- name: pr:waiting-for-review
  color: 1D76DB
  description: A reviewer owns the next action; required approval is pending or unverifiable
- name: pr:waiting-for-author
  color: 1D76DB
  description: The author needs to address human review feedback or human-endorsed inline feedback
- name: pr:review-approved
  color: 1D76DB
  description: Required reviews are approved; checks may still be pending
- name: pr:needs-rebase
  color: 1D76DB
  description: The pull request has merge conflicts
- name: pr:ready-for-queue
  color: 1D76DB
  description: Review, checks and mergeability permit adding this PR to the queue
- name: pr:needs-author-response
  color: 1D76DB
  description: A reviewer manually requested an author response
- name: pr:do-not-merge
  color: 1D76DB
  description: Don't merge this PR until open discussion items or issues are complete
